<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1a2e">
    <title>Météo</title>
    
    <style>
        /* Critical CSS - First Paint */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; color: #fff; overflow: hidden; background: #1a1a2e; }
        .app { width: 100%; max-width: 430px; margin: 0 auto; position: relative; }
        .bg-layer { position: fixed; top: 0; left: 0; right: 0; bottom: 0; transition: background 1.5s ease; z-index: 0; }
        .bg-default { background: linear-gradient(180deg, #1e3a5f 0%, #2b5876 100%); }
        .scroll-container { position: relative; z-index: 1; overflow-y: auto; overflow-x: hidden; height: 100vh; padding-bottom: 40px; }
        .scroll-container::-webkit-scrollbar { width: 0; display: none; }
        .weather-hero { text-align: center; padding: 0 20px 10px; }
        .city { font-size: 34px; font-weight: 400; margin-bottom: 2px; letter-spacing: 0.3px; }
        .big-temp { font-size: 96px; font-weight: 200; line-height: 1; margin: 6px 0; letter-spacing: -4px; }
        .condition { font-size: 21px; font-weight: 400; margin-bottom: 4px; }
        .high-low { font-size: 17px; font-weight: 500; opacity: 0.85; }
        .hidden { display: none !important; }
        .loading { text-align: center; padding: 40px; font-size: 18px; opacity: 0.7; }
    </style>
    
    <link rel="preload" href="style.css?v=20" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="preload" href="apple-weather-atmosphere.css?v=3" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="preload" href="apple-weather-icons.css?v=1" as="style" onload="this.onload=null;this.rel='stylesheet'">

    <!-- UI Icons Sprite -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
        <symbol id="icon-search" viewBox="0 0 24 24"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 0 0 1.48-5.34c-.47-2.78-2.79-5-5.59-5.34a6.505 6.505 0 0 0-7.27 7.27c.34 2.8 2.56 5.12 5.34 5.59a6.5 6.5 0 0 0 5.34-1.48l.27.28v.79l4.25 4.25c.41.41 1.08.41 1.49 0 .41-.41.41-1.08 0-1.49L15.5 14zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></symbol>
        <symbol id="icon-location" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></symbol>
        <symbol id="icon-close" viewBox="0 0 24 24"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></symbol>
        <symbol id="icon-warning" viewBox="0 0 24 24"><path fill="currentColor" d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></symbol>
        <symbol id="icon-menu" viewBox="0 0 24 24"><path fill="currentColor" d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></symbol>
        <symbol id="icon-droplet" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C10.16 4.44 6 10.32 6 13.5a6 6 0 0 0 12 0C18 10.32 13.84 4.44 12 2z" opacity="0.85"/></symbol>
        <symbol id="icon-wind" viewBox="0 0 24 24"><path fill="currentColor" d="M3 11h12a3 3 0 0 0 3-3 3 3 0 0 0-3-3 3 3 0 0 0-3 3h-2a5 5 0 0 1 5-5 5 5 0 0 1 5 5 5 5 0 0 1-5 5H3v-2zm0 5h14a3 3 0 0 1 3 3 3 3 0 0 1-3 3 3 3 0 0 1-3-3h-2a5 5 0 0 0 5 5 5 5 0 0 0 5-5 5 5 0 0 0-5-5H3v-2z"/></symbol>
        <symbol id="icon-gauge" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm-1-13v4l-3 3 1.41 1.41L12 13.83V7h-1z"/></symbol>
        <symbol id="icon-sun" viewBox="0 0 24 24"><path fill="currentColor" d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 0 0 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></symbol>
    </svg>
</head>
<body>
    <div class="app">
        <!-- Background -->
        <div class="background"><div class="bg-layer bg-default"></div></div>

        <!-- Main Scroll -->
        <div class="scroll-container">
            <!-- Search -->
            <div class="search-container">
                <div class="search-box">
                    <svg class="search-icon" width="18" height="18"><use href="#icon-search"/></svg>
                    <input type="text" id="city-input" placeholder="Rechercher une ville..." autocomplete="off">
                    <button class="search-location-btn" id="locate-btn" aria-label="Ma position">
                        <svg width="20" height="20"><use href="#icon-location"/></svg>
                    </button>
                </div>
                <div class="search-suggestions" id="search-suggestions"></div>
            </div>

            <!-- Weather Hero -->
            <div class="weather-hero">
                <h1 class="city" id="city-name"></h1>
                <div class="big-temp" id="current-temp"></div>
                <div class="condition" id="condition"></div>
                <div class="high-low" id="high-low"></div>
            </div>

            <!-- Solar Bar (Sunrise/Sunset) -->
            <div class="solar-card card">
                <div class="solar-bar">
                    <div class="solar-label">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" opacity="0.5"><use href="#icon-sun"/></svg>
                        <span id="sunrise-time">--:--</span>
                    </div>
                    <div class="solar-track">
                        <div class="solar-progress" id="solar-progress"></div>
                        <div class="solar-dot" id="solar-dot" style="left:50%">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="#FFD60A"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="9" fill="none" stroke="#FFD60A" stroke-width="1.5" opacity="0.5"/></svg>
                        </div>
                    </div>
                    <div class="solar-label right">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" opacity="0.5"><use href="#icon-sun"/></svg>
                        <span id="sunset-time">--:--</span>
                    </div>
                </div>
            </div>

            <!-- Alert Banner -->
            <div class="alert-banner hidden" id="alert-banner">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="#FF9500"><use href="#icon-warning"/></svg>
                <div class="alert-text">
                    <div class="alert-title" id="alert-title"></div>
                    <div class="alert-desc" id="alert-desc"></div>
                </div>
            </div>

            <!-- 4 Data Tiles -->
            <div class="data-grid">
                <div class="card data-tile">
                    <div class="data-label">
                        <svg width="16" height="16"><use href="#icon-droplet"/></svg>
                        <span>HUMIDITÉ</span>
                    </div>
                    <div class="data-value" id="humidity">--%</div>
                </div>
                <div class="card data-tile">
                    <div class="data-label">
                        <svg width="16" height="16"><use href="#icon-wind"/></svg>
                        <span>VENT</span>
                    </div>
                    <div class="data-value" id="wind">-- <span class="unit">km/h</span></div>
                    <div class="data-desc" id="wind-dir"></div>
                </div>
                <div class="card data-tile">
                    <div class="data-label">
                        <svg width="16" height="16"><use href="#icon-sun"/></svg>
                        <span>INDEX UV</span>
                    </div>
                    <div class="uv-gauge">
                        <svg class="uv-svg" viewBox="0 0 120 60">
                            <path d="M10 55 A 50 50 0 0 1 110 55" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" stroke-linecap="round"/>
                            <path class="uv-arc" d="M10 55 A 50 50 0 0 1 110 55" fill="none" stroke="#FF9500" stroke-width="8" stroke-linecap="round" stroke-dasharray="157" stroke-dashoffset="157" id="uv-arc"/>
                        </svg>
                        <div class="uv-value" id="uv-value">--</div>
                        <div class="uv-label" id="uv-label">Faible</div>
                    </div>
                </div>
                <div class="card data-tile">
                    <div class="data-label">
                        <svg width="16" height="16"><use href="#icon-gauge"/></svg>
                        <span>PRESSION</span>
                    </div>
                    <div class="data-value" id="pressure">-- <span class="unit">hPa</span></div>
                    <div class="data-desc" id="pressure-trend"></div>
                </div>
            </div>

            <!-- Weekly Forecast -->
            <div class="card weekly-card">
                <div class="card-label">PRÉVISIONS SUR 10 JOURS</div>
                <div class="weekly-list" id="weekly-list"></div>
            </div>

            <!-- Radar Map -->
            <div class="card radar-card">
                <div class="radar-header">
                    <div class="card-label">CARTE RADAR</div>
                    <div class="radar-tabs">
                        <button class="radar-tab active" data-mode="precipitation">Précipitations</button>
                        <button class="radar-tab" data-mode="temperature">Température</button>
                        <button class="radar-tab" data-mode="wind">Vent</button>
                    </div>
                </div>
                <div class="radar-container" id="radar-container">
                    <div class="radar-placeholder">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 2v10l6 6M12 2a10 10 0 1 0 10 10"/></svg>
                        <span>Carte non disponible</span>
                    </div>
                    <div class="radar-timeline" id="radar-timeline">
                        <span class="timeline-label active">Maintenant</span>
                        <span class="timeline-label">+1h</span>
                        <span class="timeline-label">+2h</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="apple-weather-icons.js?v=9"></script>
    <script src="weather-icons.js?v=17"></script>
    <script src="script.js?v=20"></script>
</body>
</html>
