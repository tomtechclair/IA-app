<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Météo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;color:#fff;transition:background .8s ease;background:#667eea}
.container{max-width:420px;margin:0 auto;padding:50px 24px 30px;flex:1;display:flex;flex-direction:column}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
.city-name{font-size:22px;font-weight:500;letter-spacing:1px;text-transform:uppercase}
.settings-btn{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;opacity:.7;padding:8px}
.hero{text-align:center;margin-bottom:auto;padding:20px 0}
.hero-icon{font-size:90px;line-height:1;margin-bottom:10px;filter:drop-shadow(0 4px 20px rgba(0,0,0,.15))}
.hero-temp{font-size:96px;font-weight:200;letter-spacing:-3px;line-height:1}
.hero-temp .deg{font-size:48px;font-weight:200}
.hero-desc{font-size:18px;font-weight:400;opacity:.85;margin-top:4px}
.hero-hl{font-size:16px;font-weight:400;opacity:.65;margin-top:4px}
.weekly{margin-top:0;padding:0 0 20px}
.week-item{display:flex;align-items:center;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.week-item:last-child{border-bottom:none}
.week-day{width:70px;font-size:15px;font-weight:500;letter-spacing:.5px}
.week-icon{width:36px;text-align:center;font-size:24px}
.week-temps{margin-left:auto;display:flex;gap:14px}
.week-max{font-size:16px;font-weight:500}
.week-min{font-size:16px;font-weight:400;opacity:.6}
.search-bar{background:rgba(255,255,255,.15);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);border-radius:25px;padding:10px 16px;display:flex;align-items:center;gap:10px;margin-bottom:20px;border:1px solid rgba(255,255,255,.15)}
.search-bar input{flex:1;background:none;border:none;color:#fff;font-size:15px;outline:none;font-family:inherit}
.search-bar input::placeholder{color:rgba(255,255,255,.5)}
.search-bar button{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;opacity:.7;padding:4px}
.pagination{display:flex;justify-content:center;gap:6px;margin-top:20px}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35)}
.dot.active{background:#fff;width:18px;border-radius:3px}
.loading{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;font-size:16px;opacity:0;pointer-events:none;transition:opacity .3s}
.loading.show{opacity:1;pointer-events:auto}
.weather-icon svg{width:90px;height:90px;filter:drop-shadow(0 4px 20px rgba(0,0,0,.15))}
.weather-icon svg *{animation:none!important}
</style>
</head>
<body>
<div class="loading" id="loading"></div>
<div class="container" id="app">
  <div class="header">
    <div class="city-name" id="cityName">--</div>
    <button class="settings-btn" id="searchToggle">🔍</button>
  </div>
  <div id="searchBox" class="search-bar" style="display:none">
    <input type="text" id="searchInput" placeholder="Rechercher une ville..." autocomplete="off">
    <button id="searchGo">🔍</button>
  </div>
  <div class="hero">
    <div class="hero-icon" id="weatherIcon">☀️</div>
    <div class="hero-temp"><span id="tempValue">--</span><span class="deg">°</span></div>
    <div class="hero-desc" id="weatherDesc">--</div>
    <div class="hero-hl" id="highLow">--</div>
  </div>
  <div class="weekly" id="weeklyList"></div>
  <div class="pagination"><div class="dot active"></div><div class="dot"></div><div class="dot"></div></div>
</div>
<script>
// ---- Consts ----
var GEO='https://geocoding-api.open-meteo.com/v1/search';
var WX='https://api.open-meteo.com/v1/forecast';
var AQ='https://air-quality-api.open-meteo.com/v1/air-quality';

// ---- Helpers ----
function $(id){return document.getElementById(id)}

// ---- WMO icons ----
var wmoIcons={
 0:['☀️','🌙'],1:['⛅','☁️'],2:['⛅','☁️'],3:['☁️','☁️'],
 45:['🌫️','🌫️'],48:['🌫️','🌫️'],
 51:['🌦️','🌦️'],53:['🌦️','🌦️'],55:['🌧️','🌧️'],
 61:['🌦️','🌦️'],63:['🌧️','🌧️'],65:['🌧️','🌧️'],
 71:['❄️','❄️'],73:['❄️','❄️'],75:['❄️','❄️'],
 80:['🌦️','🌦️'],81:['🌧️','🌧️'],82:['🌧️','🌧️'],
 95:['⛈️','⛈️'],96:['⛈️','⛈️'],99:['⛈️','⛈️']
};
var wmoDesc={
 0:'Ciel dégagé',1:'Peu nuageux',2:'Partiellement nuageux',3:'Nuageux',
 45:'Brouillard',48:'Brouillard givrant',
 51:'Bruine légère',53:'Bruine',55:'Bruine forte',
 61:'Pluie légère',63:'Pluie',65:'Forte pluie',
 71:'Neige légère',73:'Neige',75:'Forte neige',
 80:'Averses',81:'Averses',82:'Fortes averses',
 95:'Orage',96:'Orage violent',99:'Orage violent'
};
function wi(code,isDay){var a=wmoIcons[code];return a?a[isDay?0:1]:'☀️'}
function wd(code){return wmoDesc[code]||'---'}

// ---- Backgrounds ----
function setBg(code,isDay){
  var b=document.body;
  if(!isDay){b.style.background='linear-gradient(135deg,#0f0c29,#302b63,#24243e)';return}
  if(code===0||code===1)b.style.background='linear-gradient(135deg,#2980B9,#6DD5FA,#87CEEB)';
  else if(code===2||code===3)b.style.background='linear-gradient(135deg,#667eea,#764ba2,#6B8DD6)';
  else if(code>=45&&code<=48)b.style.background='linear-gradient(135deg,#757F9A,#D7DDE8)';
  else if(code>=51&&code<=82)b.style.background='linear-gradient(135deg,#2c3e50,#4ca1af,#2c3e50)';
  else if(code>=71&&code<=77)b.style.background='linear-gradient(135deg,#83a4d4,#b6fbff)';
  else if(code>=95)b.style.background='linear-gradient(135deg,#232526,#414345,#232526)';
  else b.style.background='linear-gradient(135deg,#2980B9,#6DD5FA,#87CEEB)';
}

// ---- Wind direction ----
function windDir(d){var dirs=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];return dirs[Math.round(d/22.5)%16]}

// ---- Days ----
function dayName(i){var d=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];if(i===0)return"Aujourd'hui";if(i===1)return'Demain';return d[new Date(Date.now()+i*86400000).getDay()]}

// ---- Loading ----
function showLoad(){var l=$('loading');l.textContent='Chargement...';l.classList.add('show')}
function hideLoad(){$('loading').classList.remove('show')}

// ---- Search ----
$('searchToggle').onclick=function(){var s=$('searchBox');s.style.display=s.style.display==='none'?'flex':'none';if(s.style.display==='flex')$('searchInput').focus()};
$('searchInput').onkeydown=function(e){if(e.key==='Enter')doSearch()};
$('searchGo').onclick=doSearch;

async function doSearch(){
  var q=$('searchInput').value.trim();
  if(q.length<2)return;
  showLoad();
  try{
    var r=await fetch(GEO+'?name='+encodeURIComponent(q)+'&count=5&language=fr&format=json');
    var d=await r.json();
    if(d.results&&d.results.length){var c=d.results[0];loadWeather(c.latitude,c.longitude,c.name);$('searchBox').style.display='none';$('searchInput').value=''}
    else{$('loading').textContent='Ville non trouvée';setTimeout(hideLoad,1500)}
  }catch(e){$('loading').textContent='Erreur';setTimeout(hideLoad,1500)}
}

// ---- Main ----
async function loadWeather(lat,lon,city){
  showLoad();
  try{
    var r=await fetch(WX+'?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,pressure_msl,is_day,precipitation&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max&hourly=temperature_2m,weather_code,precipitation_probability&timezone=auto&forecast_days=7');
    var w=await r.json();
    var c=w.current,dd=w.daily,hh=w.hourly;
    var isDay=c.is_day!==0;
    setBg(c.weather_code,isDay);
    
    // Hero
    $('cityName').textContent=city.toUpperCase();
    $('weatherIcon').textContent=wi(c.weather_code,isDay);
    $('tempValue').textContent=Math.round(c.temperature_2m);
    $('weatherDesc').textContent=wd(c.weather_code);
    $('highLow').textContent='H:'+Math.round(dd.temperature_2m_max[0])+'° L:'+Math.round(dd.temperature_2m_min[0])+'° | Ressenti '+Math.round(c.apparent_temperature)+'°';
    
    // Weekly - FUSEAU LOCAL via utc_offset_seconds
    var offH=Math.floor((w.utc_offset_seconds||0)/3600);
    var utcH=new Date().getUTCHours();
    var localH=((utcH+offH)%24+24)%24;
    
    var wl=$('weeklyList');
    wl.innerHTML='';
    for(var i=0;i<7;i++){
      if(!dd.time[i])break;
      var icon=wi(dd.weather_code[i],true);
      var precip=dd.precipitation_probability_max[i];
      wl.innerHTML+='<div class="week-item"><div class="week-day">'+dayName(i)+'</div><div class="week-icon">'+icon+'</div>'+(precip>5?'<span style="font-size:12px;color:#64D2FF;width:35px;text-align:center">'+precip+'%</span>':'<span style="width:35px"></span>')+'<div class="week-temps"><span class="week-max">'+Math.round(dd.temperature_2m_max[i])+'°</span><span class="week-min">'+Math.round(dd.temperature_2m_min[i])+'°</span></div></div>';
    }
    hideLoad()
  }catch(e){$('loading').textContent='Erreur de chargement';console.error(e);setTimeout(hideLoad,2000)}
}

// ---- Geoloc ----
if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(
    function(pos){
      fetch('https://nominatim.openstreetmap.org/reverse?lat='+pos.coords.latitude+'&lon='+pos.coords.longitude+'&format=json&accept-language=fr',{headers:{'User-Agent':'MeteoApp/1.0'}})
      .then(function(r){return r.json()})
      .then(function(d){var city=d.address.city||d.address.town||d.address.village||'Ma position';loadWeather(pos.coords.latitude,pos.coords.longitude,city)})
      .catch(function(){loadWeather(48.8566,2.3522,'Paris')})
    },
    function(){loadWeather(48.8566,2.3522,'Paris')},
    {timeout:5000,maximumAge:300000}
  )
}else{loadWeather(48.8566,2.3522,'Paris')}
</script>
</body>
</html>
