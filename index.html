<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Météo - Prévisions en temps réel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* Container principal */
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 48px;
            color: white;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            color: rgba(255,255,255,0.9);
            font-size: 18px;
        }

        /* Barre de recherche */
        .search-section {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .search-box {
            display: flex;
            gap: 10px;
            background: white;
            padding: 5px 5px 5px 20px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .search-box input {
            width: 300px;
            padding: 12px 0;
            border: none;
            outline: none;
            font-size: 16px;
        }

        .search-box button {
            background: #667eea;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .search-box button:hover {
            transform: scale(1.02);
            background: #5a67d8;
        }

        .location-btn {
            background: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            color: #667eea;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .location-btn:hover {
            transform: scale(1.02);
        }

        /* Suggestions */
        .suggestions-container {
            position: relative;
            display: inline-block;
        }

        .suggestions-list {
            position: absolute;
            top: 55px;
            left: 20px;
            right: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 100;
            display: none;
        }

        .suggestions-list div {
            padding: 12px 20px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            color: #333;
        }

        .suggestions-list div:hover {
            background: #f0f0f0;
        }

        /* Message géoloc */
        .geo-message {
            text-align: center;
            background: rgba(255,255,255,0.2);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: white;
            display: none;
        }

        .geo-message.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        /* Carte météo principale */
        .weather-card {
            background: rgba(255,255,255,0.95);
            border-radius: 30px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
        }

        .city-name {
            font-size: 42px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .date {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
        }

        .main-temp {
            font-size: 96px;
            font-weight: 300;
            color: #667eea;
            margin: 20px 0;
        }

        .condition {
            font-size: 24px;
            color: #555;
            margin-bottom: 30px;
        }

        .temp-details {
            display: flex;
            justify-content: center;
            gap: 30px;
            font-size: 18px;
            color: #666;
        }

        /* Grille des détails */
        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .detail-card {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .detail-card .label {
            font-size: 14px;
            color: #888;
            margin-bottom: 10px;
        }

        .detail-card .value {
            font-size: 28px;
            font-weight: 600;
            color: #333;
        }

        /* Section prévisions */
        .section-title {
            font-size: 28px;
            font-weight: 600;
            color: white;
            margin: 40px 0 20px 0;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        /* Prévisions horaires */
        .hourly-container {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 20px;
            overflow-x: auto;
        }

        .hourly-scroll {
            display: flex;
            gap: 25px;
            min-width: min-content;
        }

        .hourly-item {
            text-align: center;
            padding: 15px;
            min-width: 90px;
        }

        .hourly-time {
            font-size: 16px;
            font-weight: 600;
            color: #666;
            margin-bottom: 10px;
        }

        .hourly-icon {
            font-size: 36px;
            margin: 10px 0;
        }

        .hourly-temp {
            font-size: 20px;
            font-weight: 600;
            color: #667eea;
        }

        /* Prévisions 7 jours */
        .forecast-container {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 20px;
        }

        .forecast-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
        }

        .forecast-item:last-child {
            border-bottom: none;
        }

        .forecast-day {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            width: 120px;
        }

        .forecast-icon {
            font-size: 28px;
            width: 60px;
            text-align: center;
        }

        .forecast-temps {
            display: flex;
            gap: 20px;
        }

        .forecast-max {
            font-size: 18px;
            font-weight: 600;
            color: #667eea;
        }

        .forecast-min {
            font-size: 18px;
            color: #999;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 60px;
            background: rgba(255,255,255,0.95);
            border-radius: 30px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e0e0e0;
            border-top-color: #667eea;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            text-align: center;
            padding: 60px;
            background: rgba(255,255,255,0.95);
            border-radius: 30px;
            color: #e53e3e;
            font-size: 18px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            body { padding: 20px; }
            .city-name { font-size: 32px; }
            .main-temp { font-size: 64px; }
            .search-box input { width: 200px; }
            .forecast-day { width: 80px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌤️ Météo</h1>
            <p>Prévisions météo en temps réel pour toutes les villes</p>
        </div>

        <div class="search-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Entrez une ville..." onkeyup="showSuggestions()" onkeypress="if(event.key==='Enter') searchCity()">
                <button onclick="searchCity()">Rechercher</button>
            </div>
            <button class="location-btn" onclick="getUserLocation()">
                📍 Ma position
            </button>
        </div>

        <div class="suggestions-container">
            <div class="suggestions-list" id="suggestionsList"></div>
        </div>

        <div class="geo-message" id="geoMessage"></div>

        <div id="mainContent">
            <div class="loading">
                <div class="spinner"></div>
                <div>Chargement des données météo...</div>
            </div>
        </div>
    </div>

    <script>
        let suggestionsTimeout;

        function getWeatherIcon(code) {
            const icons = {
                0: "☀️", 1: "🌤️", 2: "⛅", 3: "☁️",
                45: "🌫️", 48: "🌫️",
                51: "🌧️", 53: "🌧️", 55: "🌧️",
                61: "🌧️", 63: "🌧️", 65: "🌧️",
                71: "❄️", 73: "❄️", 75: "❄️",
                80: "🌦️", 81: "🌧️", 82: "🌧️",
                95: "⛈️", 96: "⛈️", 99: "⛈️"
            };
            return icons[code] || "🌡️";
        }

        function getWeatherDescription(code) {
            const descriptions = {
                0: "Ensoleillé", 1: "Peu nuageux", 2: "Partiellement nuageux", 3: "Nuageux",
                45: "Brouillard", 48: "Brouillard", 51: "Bruine légère", 53: "Bruine", 55: "Bruine",
                61: "Pluie légère", 63: "Pluie modérée", 65: "Pluie forte",
                71: "Neige légère", 73: "Neige", 75: "Neige forte",
                80: "Averses légères", 81: "Averses", 82: "Averses fortes",
                95: "Orage", 96: "Orage", 99: "Orage"
            };
            return descriptions[code] || "Variable";
        }

        function formatDate() {
            const now = new Date();
            const jours = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];
            const mois = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
            return `${jours[now.getDay()]} ${now.getDate()} ${mois[now.getMonth()]} ${now.getFullYear()}`;
        }

        async function fetchWeatherByCity(city) {
            try {
                const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=fr&format=json`;
                const geoResponse = await fetch(geoUrl);
                const geoData = await geoResponse.json();

                if (!geoData.results || geoData.results.length === 0) {
                    return null;
                }

                const location = geoData.results[0];
                const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${location.latitude}&longitude=${location.longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,pressure_msl&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=7`;
                const weatherResponse = await fetch(weatherUrl);
                const weatherData = await weatherResponse.json();

                return {
                    name: location.name,
                    country: location.country,
                    temp: Math.round(weatherData.current.temperature_2m),
                    condition: getWeatherDescription(weatherData.current.weather_code),
                    icon: getWeatherIcon(weatherData.current.weather_code),
                    humidity: weatherData.current.relative_humidity_2m,
                    feelsLike: Math.round(weatherData.current.apparent_temperature),
                    wind: Math.round(weatherData.current.wind_speed_10m),
                    pressure: weatherData.current.pressure_msl ? Math.round(weatherData.current.pressure_msl) : 1013,
                    hourly: weatherData.hourly,
                    daily: weatherData.daily
                };
            } catch (error) {
                console.error("Erreur:", error);
                return null;
            }
        }

        async function fetchWeatherByCoords(lat, lon) {
            try {
                const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,pressure_msl&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=7`;
                const response = await fetch(weatherUrl);
                const data = await response.json();

                const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?latitude=${lat}&longitude=${lon}&count=1&language=fr&format=json`;
                const geoResponse = await fetch(geoUrl);
                const geoData = await geoResponse.json();
                let cityName = "Ma position";
                if (geoData.results && geoData.results.length > 0) {
                    cityName = geoData.results[0].name;
                }

                return {
                    name: cityName,
                    temp: Math.round(data.current.temperature_2m),
                    condition: getWeatherDescription(data.current.weather_code),
                    icon: getWeatherIcon(data.current.weather_code),
                    humidity: data.current.relative_humidity_2m,
                    feelsLike: Math.round(data.current.apparent_temperature),
                    wind: Math.round(data.current.wind_speed_10m),
                    pressure: data.current.pressure_msl ? Math.round(data.current.pressure_msl) : 1013,
                    hourly: data.hourly,
                    daily: data.daily
                };
            } catch (error) {
                console.error("Erreur:", error);
                return null;
            }
        }

        function generateHourlyForecast(weather) {
            if (!weather.hourly || !weather.hourly.temperature_2m) return '<div>Aucune donnée</div>';
            
            const now = new Date();
            const currentHour = now.getHours();
            let html = '';
            
            for (let i = 0; i < 12; i++) {
                const hourIndex = (currentHour + i) % 24;
                let hourLabel = i === 0 ? 'Maintenant' : `${hourIndex}h`;
                const temp = Math.round(weather.hourly.temperature_2m[hourIndex]);
                const icon = getWeatherIcon(weather.hourly.weather_code[hourIndex]);
                
                html += `
                    <div class="hourly-item">
                        <div class="hourly-time">${hourLabel}</div>
                        <div class="hourly-icon">${icon}</div>
                        <div class="hourly-temp">${temp}°</div>
                    </div>
                `;
            }
            return html;
        }

        function generateForecast(weather) {
            if (!weather.daily) return '<div>Aucune donnée</div>';
            
            const days = ['Aujourd\'hui', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
            const today = new Date().getDay();
            let html = '';
            
            for (let i = 0; i < Math.min(7, weather.daily.time.length); i++) {
                let dayName = i === 0 ? 'Aujourd\'hui' : days[(today + i) % 7];
                const maxTemp = Math.round(weather.daily.temperature_2m_max[i]);
                const minTemp = Math.round(weather.daily.temperature_2m_min[i]);
                const icon = getWeatherIcon(weather.daily.weather_code[i]);
                
                html += `
                    <div class="forecast-item">
                        <div class="forecast-day">${dayName}</div>
                        <div class="forecast-icon">${icon}</div>
                        <div class="forecast-temps">
                            <span class="forecast-max">${maxTemp}°</span>
                            <span class="forecast-min">${minTemp}°</span>
                        </div>
                    </div>
                `;
            }
            return html;
        }

        function displayWeather(weather) {
            const mainContent = document.getElementById('mainContent');
            
            mainContent.innerHTML = `
                <div class="weather-card">
                    <div class="city-name">${weather.name}</div>
                    <div class="date">${formatDate()}</div>
                    <div class="main-temp">${weather.temp}°C</div>
                    <div class="condition">${weather.icon} ${weather.condition}</div>
                    <div class="temp-details">
                        <span>🌡️ Ressenti ${weather.feelsLike}°C</span>
                    </div>
                </div>

                <div class="details-grid">
                    <div class="detail-card">
                        <div class="label">💧 Humidité</div>
                        <div class="value">${weather.humidity}%</div>
                    </div>
                    <div class="detail-card">
                        <div class="label">💨 Vent</div>
                        <div class="value">${weather.wind} km/h</div>
                    </div>
                    <div class="detail-card">
                        <div class="label">🌡️ Ressenti</div>
                        <div class="value">${weather.feelsLike}°C</div>
                    </div>
                    <div class="detail-card">
                        <div class="label">📊 Pression</div>
                        <div class="value">${weather.pressure} hPa</div>
                    </div>
                </div>

                <div class="section-title">📅 Prévisions horaires</div>
                <div class="hourly-container">
                    <div class="hourly-scroll">
                        ${generateHourlyForecast(weather)}
                    </div>
                </div>

                <div class="section-title">📆 Prévisions 7 jours</div>
                <div class="forecast-container">
                    ${generateForecast(weather)}
                </div>
            `;
        }

        async function loadWeather(cityName) {
            const mainContent = document.getElementById('mainContent');
            mainContent.innerHTML = '<div class="loading"><div class="spinner"></div><div>Chargement de la météo...</div></div>';
            
            const weather = await fetchWeatherByCity(cityName);
            
            if (!weather) {
                mainContent.innerHTML = '<div class="error">❌ Ville non trouvée. Vérifiez l\'orthographe.</div>';
                return;
            }
            
            displayWeather(weather);
        }

        async function getUserLocation() {
            const geoMessage = document.getElementById('geoMessage');
            
            if (!navigator.geolocation) {
                geoMessage.textContent = "❌ La géolocalisation n'est pas supportée";
                geoMessage.classList.add('show');
                setTimeout(() => geoMessage.classList.remove('show'), 3000);
                return;
            }
            
            geoMessage.textContent = "📍 Recherche de votre position...";
            geoMessage.classList.add('show');
            
            navigator.geolocation.getCurrentPosition(async (position) => {
                const { latitude, longitude } = position.coords;
                
                const mainContent = document.getElementById('mainContent');
                mainContent.innerHTML = '<div class="loading"><div class="spinner"></div><div>Chargement de votre météo...</div></div>';
                
                const weather = await fetchWeatherByCoords(latitude, longitude);
                
                if (weather) {
                    displayWeather(weather);
                    document.getElementById('searchInput').value = weather.name;
                    geoMessage.textContent = "📍 Météo de votre position";
                    setTimeout(() => geoMessage.classList.remove('show'), 2000);
                } else {
                    mainContent.innerHTML = '<div class="error">❌ Impossible de récupérer la météo</div>';
                }
            }, (error) => {
                geoMessage.textContent = "❌ Position non autorisée. Activez la localisation.";
                setTimeout(() => geoMessage.classList.remove('show'), 3000);
            });
        }

        async function showSuggestions() {
            clearTimeout(suggestionsTimeout);
            const input = document.getElementById('searchInput');
            const query = input.value.trim();
            
            if (query.length < 2) {
                document.getElementById('suggestionsList').style.display = 'none';
                return;
            }
            
            suggestionsTimeout = setTimeout(async () => {
                try {
                    const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=5&language=fr&format=json`;
                    const response = await fetch(geoUrl);
                    const data = await response.json();
                    const suggestionsList = document.getElementById('suggestionsList');
                    
                    if (data.results && data.results.length > 0) {
                        suggestionsList.innerHTML = '';
                        data.results.forEach(result => {
                            const div = document.createElement('div');
                            div.textContent = `${result.name}, ${result.country || 'France'}`;
                            div.onclick = () => {
                                document.getElementById('searchInput').value = result.name;
                                suggestionsList.style.display = 'none';
                                loadWeather(result.name);
                            };
                            suggestionsList.appendChild(div);
                        });
                        suggestionsList.style.display = 'block';
                    } else {
                        suggestionsList.style.display = 'none';
                    }
                } catch (error) {
                    document.getElementById('suggestionsList').style.display = 'none';
                }
            }, 300);
        }

        function searchCity() {
            const input = document.getElementById('searchInput');
            const city = input.value.trim();
            if (city) {
                document.getElementById('suggestionsList').style.display = 'none';
                loadWeather(city);
            }
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.search-box') && !e.target.closest('.suggestions-list')) {
                document.getElementById('suggestionsList').style.display = 'none';
            }
        });

        loadWeather("Paris");
    </script>
</body>
</html>
