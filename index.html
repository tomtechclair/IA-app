<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Météo — Style Apple</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root { --glass-bg: rgba(255,255,255,0.08); --glass-border: rgba(255,255,255,0.15); }
        body { font-family: 'Inter',-apple-system,BlinkMacSystemFont,sans-serif; color: white; overflow-x: hidden; overflow-y: auto; min-height: 100vh; background: #000; }
        .bg-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; transition: opacity 1.5s ease; }
        .bg-sunny { background: linear-gradient(180deg,#4facfe 0%,#00f2fe 40%,#43e97b 100%); }
        .bg-cloudy { background: linear-gradient(180deg,#667eea 0%,#764ba2 50%,#6B8DD6 100%); }
        .bg-rain { background: linear-gradient(180deg,#2c3e50 0%,#4ca1af 60%,#2c3e50 100%); }
        .bg-night { background: linear-gradient(180deg,#0f0c29 0%,#302b63 50%,#24243e 100%); }
        .bg-snow { background: linear-gradient(180deg,#83a4d4 0%,#b6fbff 100%); }
        .bg-storm { background: linear-gradient(180deg,#232526 0%,#414345 50%,#232526 100%); }
        .bg-fog { background: linear-gradient(180deg,#757F9A 0%,#D7DDE8 100%); }
        .blob-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; pointer-events: none; }
        .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.4; animation: float 20s infinite ease-in-out; }
        .blob-1 { width: 400px; height: 400px; background: rgba(255,255,255,0.15); top: -100px; left: -100px; }
        .blob-2 { width: 300px; height: 300px; background: rgba(255,255,255,0.1); bottom: -50px; right: -50px; animation-delay: -5s; }
        .blob-3 { width: 250px; height: 250px; background: rgba(255,255,255,0.08); top: 50%; left: 50%; animation-delay: -10s; }
        @keyframes float { 0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(30px,-30px) scale(1.1)} 66%{transform:translate(-20px,20px) scale(0.9)} }
        .rain-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; display: none; }
        .rain-container.active { display: block; }
        .raindrop { position: absolute; width: 2px; height: 15px; background: rgba(255,255,255,0.3); animation: fall linear infinite; border-radius: 2px; }
        @keyframes fall { to { transform: translateY(100vh); } }
        .app-container { max-width: 430px; margin: 0 auto; padding: 0 20px 40px; position: relative; z-index: 1; width: 100%; }
        .search-section { padding-top: 20px; margin-bottom: 20px; position: relative; }
        .search-box { position: relative; background: rgba(255,255,255,0.12); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 12px; border: 1px solid var(--glass-border); overflow: hidden; transition: all 0.3s ease; }
        .search-box:focus-within { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.3); }
        .search-input { width: 100%; padding: 12px 80px 12px 16px; background: transparent; border: none; color: white; font-size: 16px; font-family: inherit; outline: none; }
        .search-input::placeholder { color: rgba(255,255,255,0.5); }
        .search-btn, .locate-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.15); border: none; color: white; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; }
        .search-btn:hover, .locate-btn:hover { background: rgba(255,255,255,0.25); }
        .search-btn { right: 8px; }
        .search-btn svg, .locate-btn svg { width: 16px; height: 16px; }
        .locate-btn { right: 46px; background: transparent; color: rgba(255,255,255,0.6); }
        .locate-btn:hover { color: white; background: rgba(255,255,255,0.1); }
        .locate-btn svg { width: 18px; height: 18px; }
        .search-results { position: absolute; top: 100%; left: 0; right: 0; background: rgba(30,30,30,0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 12px; margin-top: 8px; max-height: 300px; overflow-y: auto; display: none; z-index: 100; border: 1px solid rgba(255,255,255,0.1); }
        .search-results.active { display: block; }
        .search-result-item { padding: 14px 16px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); transition: background 0.2s ease; display: flex; align-items: center; gap: 12px; }
        .search-result-item:hover { background: rgba(255,255,255,0.08); }
        .search-result-item:last-child { border-bottom: none; }
        .result-icon { width: 32px; height: 32px; background: rgba(255,255,255,0.1); border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .result-icon svg { width: 16px; height: 16px; opacity: 0.7; }
        .result-info { flex: 1; }
        .result-name { font-size: 15px; font-weight: 500; color: white; }
        .result-detail { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 2px; }
        .hero-section { text-align: center; padding: 30px 0 20px; animation: fadeInUp 0.8s ease; }
        @keyframes fadeInUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
        .city-name { font-size: 32px; font-weight: 400; letter-spacing: -0.5px; margin-bottom: 4px; }
        .weather-desc { font-size: 18px; font-weight: 300; opacity: 0.9; margin-bottom: 8px; }
        .temp-main { font-size: 96px; font-weight: 200; line-height: 1; letter-spacing: -3px; position: relative; display: inline-block; }
        .temp-main .degree { font-size: 48px; font-weight: 300; position: absolute; top: 8px; margin-left: 4px; }
        .temp-high-low { font-size: 16px; font-weight: 400; opacity: 0.8; margin-top: 8px; }
        .weather-icon-hero { width: 120px; height: 120px; margin: 0 auto 10px; position: relative; }
        .weather-icon-hero svg { width: 100%; height: 100%; filter: drop-shadow(0 4px 20px rgba(0,0,0,0.2)); }
        .glass-card { background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 20px; border: 1px solid var(--glass-border); padding: 16px; margin-bottom: 16px; position: relative; overflow: hidden; }
        .glass-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent); }
        .card-header { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.6; margin-bottom: 12px; }
        .card-header svg { width: 14px; height: 14px; }
        .hourly-scroll { display: flex; gap: 20px; overflow-x: auto; padding: 4px 4px 12px; scrollbar-width: none; }
        .hourly-scroll::-webkit-scrollbar { display: none; }
        .hour-item { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 50px; flex-shrink: 0; }
        .hour-time { font-size: 13px; font-weight: 500; opacity: 0.8; }
        .hour-icon { width: 32px; height: 32px; }
        .hour-icon svg { width: 100%; height: 100%; }
        .hour-temp { font-size: 16px; font-weight: 500; }
        .hour-precip { font-size: 11px; font-weight: 500; color: #64D2FF; margin-top: -4px; }
        .day-row { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .day-row:last-child { border-bottom: none; }
        .day-name { width: 50px; font-size: 15px; font-weight: 500; }
        .day-icon { width: 28px; height: 28px; margin: 0 12px; flex-shrink: 0; }
        .day-icon svg { width: 100%; height: 100%; }
        .day-precip { width: 30px; text-align: right; font-size: 12px; font-weight: 500; color: #64D2FF; margin-right: 8px; }
        .day-bar-container { flex: 1; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; position: relative; margin: 0 12px; }
        .day-bar { position: absolute; height: 100%; border-radius: 2px; background: linear-gradient(90deg,rgba(255,255,255,0.4),rgba(255,255,255,0.8)); transition: all 0.5s ease; }
        .day-min { width: 36px; text-align: right; font-size: 15px; font-weight: 400; opacity: 0.6; }
        .day-max { width: 36px; text-align: right; font-size: 15px; font-weight: 500; }
        .details-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .detail-card { background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 16px; border: 1px solid var(--glass-border); padding: 14px; position: relative; overflow: hidden; transition: transform 0.3s ease; }
        .detail-card:hover { transform: scale(1.02); }
        .detail-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent); }
        .detail-label { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.3px; opacity: 0.6; display: flex; align-items: center; gap: 4px; margin-bottom: 6px; }
        .detail-label svg { width: 12px; height: 12px; }
        .detail-value { font-size: 24px; font-weight: 300; line-height: 1.2; }
        .detail-value .unit { font-size: 14px; font-weight: 400; opacity: 0.7; }
        .detail-sub { font-size: 11px; font-weight: 400; opacity: 0.7; margin-top: 3px; }
        .uv-bar { width: 100%; height: 4px; background: linear-gradient(90deg,#4CAF50,#FFEB3B,#FF9800,#F44336,#9C27B0); border-radius: 2px; margin-top: 8px; position: relative; }
        .uv-indicator { position: absolute; top: -3px; width: 10px; height: 10px; background: white; border-radius: 50%; box-shadow: 0 0 8px rgba(0,0,0,0.3); transition: left 0.5s ease; }
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; transition: opacity 0.3s ease; }
        .loading-overlay.hidden { opacity: 0; pointer-events: none; }
        .loading-spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { margin-top: 16px; font-size: 14px; font-weight: 400; opacity: 0.7; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(30,30,30,0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); color: white; padding: 12px 20px; border-radius: 12px; font-size: 14px; font-weight: 500; z-index: 1001; border: 1px solid rgba(255,255,255,0.1); transition: transform 0.4s cubic-bezier(0.175,0.885,0.32,1.275); max-width: 90%; text-align: center; }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .sun-visual { width: 100%; height: 60px; position: relative; margin-top: 8px; }
        .sun-arc { width: 100%; height: 50px; border: 2px solid rgba(255,255,255,0.15); border-bottom: none; border-radius: 100px 100px 0 0; position: relative; }
        .sun-dot { position: absolute; width: 10px; height: 10px; background: #FFD93D; border-radius: 50%; box-shadow: 0 0 12px rgba(255,217,61,0.6); transition: all 0.5s ease; }
        .aqi-bar { width: 100%; height: 6px; background: linear-gradient(90deg,#4CAF50,#FFEB3B,#FF9800,#F44336,#9C27B0,#7B1FA2); border-radius: 3px; margin-top: 10px; position: relative; }
        .aqi-indicator { position: absolute; top: -4px; width: 14px; height: 14px; background: white; border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.3); transition: left 0.5s ease; }
        .aqi-label { font-size: 13px; font-weight: 500; margin-top: 6px; }
        @media(min-width:768px){ .app-container { max-width: 500px; } }
        @media(max-width:430px){ .details-grid { grid-template-columns: 1fr 1fr; gap: 8px; } .detail-value { font-size: 20px; } .temp-main { font-size: 72px; } }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
        .fade-in { animation: fadeIn 0.6s ease forwards; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
        .stagger-1 { animation-delay: 0.1s; opacity: 0; }
        .stagger-2 { animation-delay: 0.2s; opacity: 0; }
        .stagger-3 { animation-delay: 0.3s; opacity: 0; }
        .stagger-4 { animation-delay: 0.4s; opacity: 0; }
    </style>
</head>
<body>
    <div id="bgLayer" class="bg-layer bg-sunny"></div>
    <div class="blob-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    <div id="rainContainer" class="rain-container"></div>
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Chargement...</div>
    </div>
    <div id="toast" class="toast"></div>
    <div class="app-container">
        <div class="search-section">
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="Rechercher une ville..." autocomplete="off">
                <button class="locate-btn" id="locateBtn" title="Ma position">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
                </button>
                <button class="search-btn" id="searchBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                </button>
            </div>
            <div id="searchResults" class="search-results"></div>
        </div>
        <div class="hero-section" id="heroSection">
            <div class="city-name" id="cityName">--</div>
            <div class="weather-desc" id="weatherDesc">--</div>
            <div class="weather-icon-hero" id="weatherIconHero"></div>
            <div class="temp-main"><span id="tempMain">--</span><span class="degree">°</span></div>
            <div class="temp-high-low" style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
                <span>↑ <span id="tempMax">--</span>°</span>
                <span>↓ <span id="tempMin">--</span>°</span>
                <span style="opacity:0.6;">Ressenti <span id="feelsLike">--</span>°</span>
            </div>
        </div>
        <div class="glass-card fade-in stagger-1">
            <div class="card-header">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                Prévisions horaires
            </div>
            <div class="hourly-scroll" id="hourlyScroll"></div>
        </div>
        <div class="glass-card fade-in stagger-2">
            <div class="card-header">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                Prévisions sur 10 jours
            </div>
            <div id="dailyForecast"></div>
        </div>
        <div class="details-grid fade-in stagger-3">
            <div class="detail-card">
                <div class="detail-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/></svg>UV</div>
                <div class="detail-value" id="uvValue">--</div>
                <div class="detail-sub" id="uvSub">--</div>
                <div class="uv-bar"><div class="uv-indicator" id="uvIndicator" style="left:0%"></div></div>
            </div>
            <div class="detail-card">
                <div class="detail-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>Humidité</div>
                <div class="detail-value"><span id="humidityValue">--</span><span class="unit">%</span></div>
                <div class="detail-sub" id="humiditySub">--</div>
            </div>
            <div class="detail-card">
                <div class="detail-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.59 4.59A2 2 0 1 1 11 8H2"/></svg>Vent</div>
                <div class="detail-value"><span id="windValue">--</span><span class="unit">km/h</span></div>
                <div class="detail-sub" id="windSub">--</div>
            </div>
            <div class="detail-card">
                <div class="detail-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/></svg>Pression</div>
                <div class="detail-value"><span id="pressureValue">--</span><span class="unit">hPa</span></div>
                <div class="detail-sub" id="pressureSub">--</div>
            </div>
            <div class="detail-card">
                <div class="detail-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>Visibilité</div>
                <div class="detail-value"><span id="visibilityValue">--</span><span class="unit">km</span></div>
                <div class="detail-sub" id="visibilitySub">--</div>
            </div>
            <div class="detail-card">
                <div class="detail-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 18a5 5 0 0 0-10 0"/></svg>Soleil</div>
                <div class="sun-visual"><div class="sun-arc"><div class="sun-dot" id="sunDot" style="left:50%;bottom:-5px;"></div></div></div>
                <div style="display:flex;justify-content:space-between;margin-top:4px;"><span style="font-size:11px;opacity:0.7;">Lév.<span id="sunriseTime">--:--</span></span><span style="font-size:11px;opacity:0.7;">Couch.<span id="sunsetTime">--:--</span></span></div>
            </div>
            <div class="detail-card">
                <div class="detail-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15a6 6 0 0 1 12 0"/><path d="M12 9V2"/></svg>Ressenti</div>
                <div class="detail-value"><span id="feelsLikeValue">--</span><span class="unit">°</span></div>
                <div class="detail-sub" id="feelsLikeSub">--</div>
            </div>
            <div class="detail-card">
                <div class="detail-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 12h20"/><path d="M12 2a10 10 0 0 1 10 10"/></svg>Précip.</div>
                <div class="detail-value"><span id="precipValue">--</span><span class="unit">mm</span></div>
                <div class="detail-sub" id="precipSub">--</div>
            </div>
            <div class="detail-card">
                <div class="detail-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="22"/><path d="M9 2l3 1 3-1"/></svg>Rafales</div>
                <div class="detail-value"><span id="gustValue">--</span><span class="unit">km/h</span></div>
                <div class="detail-sub" id="gustSub">--</div>
            </div>
            <div class="detail-card">
                <div class="detail-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><path d="M12 5v14"/></svg>Nuages</div>
                <div class="detail-value"><span id="cloudValue">--</span><span class="unit">%</span></div>
                <div class="detail-sub" id="cloudSub">--</div>
            </div>
            <div class="detail-card">
                <div class="detail-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/></svg>AQI</div>
                <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:4px;"><span class="detail-value" id="aqiValue" style="font-size:24px;">--</span><span class="aqi-label" id="aqiLabel">--</span></div>
                <div class="aqi-bar"><div class="aqi-indicator" id="aqiIndicator" style="left:0%"></div></div>
                <div class="detail-sub" id="aqiSub" style="margin-top:6px;">--</div>
            </div>
        </div>
        <div style="text-align:center;padding:30px 0 10px;opacity:0.4;font-size:12px;">Données : Open-Meteo</div>
    </div>
    <script>
    // ---- Helpers temps réel (fuseau local de la ville) ----
    // Open-Meteo timezone=auto → les heures sont en temps local de la ville
    // On extrait toujours l'heure depuis la chaîne ISO sans passer par new Date()
    function extractHour(isoStr) {
        // "2026-05-22T14:00" → "14"
        return parseInt(isoStr.split("T")[1].split(":")[0], 10);
    }
    function extractTime(isoStr) {
        // "2026-05-22T14:30" → "14:30"
        return isoStr.split("T")[1].split(":").slice(0,2).join(":");
    }
    function extractDate(isoStr) {
        // "2026-05-22T14:00" → "2026-05-22"
        return isoStr.split("T")[0];
    }
    function dayLabel(dateStr, idx) {
        if (idx === 0) return "Auj.";
        if (idx === 1) return "Dem.";
        var d = new Date(dateStr + "T12:00:00");
        return d.toLocaleDateString("fr-FR", {weekday:"short"}).replace(".","");
    }
    function windDir(d) {
        var dirs = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSO","SO","OSO","O","ONO","NO","NNO"];
        return dirs[Math.round(d / 22.5) % 16];
    }
    function uvText(u) { return u <= 2 ? "Faible" : u <= 5 ? "Moderé" : u <= 7 ? "Élevé" : u <= 10 ? "Trés élevé" : "Extrême"; }
    function aqiLabel(a) { return a <= 20 ? "Excellente" : a <= 40 ? "Bonne" : a <= 60 ? "Modérée" : a <= 80 ? "Dégradée" : a <= 100 ? "Mauvaise" : "Trés mauvaise"; }
    function cloudDesc(c) { return c <= 10 ? "Ciel dégagé" : c <= 25 ? "Peu nuageux" : c <= 50 ? "Partiellement nuageux" : c <= 75 ? "Trés nuageux" : "Couvert"; }
    function precipDesc(p) { return p <= 0 ? "Aucune" : p <= 1 ? "Trace" : p <= 5 ? "Légère" : p <= 15 ? "Modérée" : "Forte"; }

    var weatherIcons = {
        sunny: '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="14" fill="#FFD93D"><animate attributeName="r" values="14;15;14" dur="3s" repeatCount="indefinite"/></circle><g stroke="#FFD93D" stroke-width="3" stroke-linecap="round"><line x1="32" y1="4" x2="32" y2="12"><animate attributeName="y1" values="4;2;4" dur="2s" repeatCount="indefinite"/></line><line x1="32" y1="52" x2="32" y2="60"><animate attributeName="y2" values="60;62;60" dur="2s" repeatCount="indefinite"/></line><line x1="4" y1="32" x2="12" y2="32"><animate attributeName="x1" values="4;2;4" dur="2s" repeatCount="indefinite"/></line><line x1="52" y1="32" x2="60" y2="32"><animate attributeName="x2" values="60;62;60" dur="2s" repeatCount="indefinite"/></line></g></svg>',
        partlyCloudy: '<svg viewBox="0 0 64 64"><circle cx="24" cy="24" r="10" fill="#FFD93D"/><path d="M44 46a10 10 0 0 0 0-20h-2a14 14 0 0 0-26 4 10 10 0 0 0 2 20h26z" fill="rgba(255,255,255,0.9)"><animateTransform attributeName="transform" type="translate" values="0,0;2,0;0,0" dur="4s" repeatCount="indefinite"/></path></svg>',
        cloudy: '<svg viewBox="0 0 64 64"><path d="M48 42a10 10 0 0 0 0-20h-2a14 14 0 0 0-26 4 10 10 0 0 0 2 20h26z" fill="rgba(255,255,255,0.85)"><animateTransform attributeName="transform" type="translate" values="0,0;3,0;0,0" dur="5s" repeatCount="indefinite"/></path></svg>',
        rain: '<svg viewBox="0 0 64 64"><path d="M44 38a10 10 0 0 0 0-20h-2a14 14 0 0 0-26 4 10 10 0 0 0 2 20h26z" fill="rgba(255,255,255,0.8)"/><g stroke="#64D2FF" stroke-width="2" stroke-linecap="round"><line x1="24" y1="42" x2="22" y2="50"><animate attributeName="y2" values="50;54;50" dur="0.8s" repeatCount="indefinite"/></line><line x1="32" y1="42" x2="30" y2="50"><animate attributeName="y2" values="50;54;50" dur="0.8s" begin="0.2s" repeatCount="indefinite"/></line><line x1="40" y1="42" x2="38" y2="50"><animate attributeName="y2" values="50;54;50" dur="0.8s" begin="0.4s" repeatCount="indefinite"/></line></g></svg>',
        heavyRain: '<svg viewBox="0 0 64 64"><path d="M44 36a10 10 0 0 0 0-20h-2a14 14 0 0 0-26 4 10 10 0 0 0 2 20h26z" fill="rgba(255,255,255,0.7)"/><g stroke="#4FC3F7" stroke-width="2" stroke-linecap="round"><line x1="20" y1="40" x2="18" y2="52"><animate attributeName="y2" values="52;58;52" dur="0.6s" repeatCount="indefinite"/></line><line x1="28" y1="40" x2="26" y2="52"><animate attributeName="y2" values="52;58;52" dur="0.6s" begin="0.15s" repeatCount="indefinite"/></line><line x1="36" y1="40" x2="34" y2="52"><animate attributeName="y2" values="52;58;52" dur="0.6s" begin="0.3s" repeatCount="indefinite"/></line><line x1="44" y1="40" x2="42" y2="52"><animate attributeName="y2" values="52;58;52" dur="0.6s" begin="0.45s" repeatCount="indefinite"/></line></g></svg>',
        snow: '<svg viewBox="0 0 64 64"><path d="M44 38a10 10 0 0 0 0-20h-2a14 14 0 0 0-26 4 10 10 0 0 0 2 20h26z" fill="rgba(255,255,255,0.85)"/><g fill="white"><circle cx="24" cy="48" r="2"><animate attributeName="cy" values="46;54;46" dur="2s" repeatCount="indefinite"/></circle><circle cx="32" cy="48" r="2"><animate attributeName="cy" values="46;54;46" dur="2s" begin="0.6s" repeatCount="indefinite"/></circle><circle cx="40" cy="48" r="2"><animate attributeName="cy" values="46;54;46" dur="2s" begin="1.2s" repeatCount="indefinite"/></circle></g></svg>',
        thunder: '<svg viewBox="0 0 64 64"><path d="M44 36a10 10 0 0 0 0-20h-2a14 14 0 0 0-26 4 10 10 0 0 0 2 20h26z" fill="rgba(255,255,255,0.6)"/><path d="M30 36 L24 46 L32 46 L28 56 L40 42 L32 42 Z" fill="#FFD93D"><animate attributeName="opacity" values="1;0.3;1" dur="0.5s" repeatCount="indefinite"/></path></svg>',
        fog: '<svg viewBox="0 0 64 64"><path d="M44 36a10 10 0 0 0 0-20h-2a14 14 0 0 0-26 4 10 10 0 0 0 2 20h26z" fill="rgba(255,255,255,0.5)"/><g stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round"><line x1="12" y1="44" x2="52" y2="44"><animate attributeName="x1" values="12;16;12" dur="3s" repeatCount="indefinite"/></line><line x1="16" y1="50" x2="48" y2="50"><animate attributeName="x2" values="48;44;48" dur="4s" repeatCount="indefinite"/></line></g></svg>',
        night: '<svg viewBox="0 0 64 64"><path d="M36 12a16 16 0 1 0 16 16 12 12 0 0 1-16-16z" fill="#FFD93D"><animateTransform attributeName="transform" type="rotate" values="0 36 28;10 36 28;0 36 28" dur="6s" repeatCount="indefinite"/></path><g fill="white" opacity="0.8"><circle cx="12" cy="16" r="1"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite"/></circle><circle cx="48" cy="8" r="1"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="3s" repeatCount="indefinite"/></circle></g></svg>',
        nightCloudy: '<svg viewBox="0 0 64 64"><path d="M40 10a14 14 0 1 0 14 14 10 10 0 0 1-14-14z" fill="#FFD93D" opacity="0.8"/><path d="M48 42a10 10 0 0 0 0-20h-2a14 14 0 0 0-26 4 10 10 0 0 0 2 20h26z" fill="rgba(255,255,255,0.6)"><animateTransform attributeName="transform" type="translate" values="0,0;2,0;0,0" dur="4s" repeatCount="indefinite"/></path></svg>',
        drizzle: '<svg viewBox="0 0 64 64"><path d="M44 38a10 10 0 0 0 0-20h-2a14 14 0 0 0-26 4 10 10 0 0 0 2 20h26z" fill="rgba(255,255,255,0.8)"/><g stroke="#81D4FA" stroke-width="1.5" stroke-linecap="round"><line x1="26" y1="42" x2="25" y2="48"><animate attributeName="y2" values="48;52;48" dur="1s" repeatCount="indefinite"/></line><line x1="32" y1="42" x2="31" y2="48"><animate attributeName="y2" values="48;52;48" dur="1s" begin="0.3s" repeatCount="indefinite"/></line><line x1="38" y1="42" x2="37" y2="48"><animate attributeName="y2" values="48;52;48" dur="1s" begin="0.6s" repeatCount="indefinite"/></line></g></svg>'
    };

    function getWeatherInfo(code, isDay) {
        var m = {
            0:{desc:"Ensoleillé",icon:isDay?"sunny":"night",bg:isDay?"bg-sunny":"bg-night"},
            1:{desc:"Peu nuageux",icon:isDay?"partlyCloudy":"nightCloudy",bg:isDay?"bg-sunny":"bg-night"},
            2:{desc:"Partiellement nuageux",icon:"partlyCloudy",bg:"bg-cloudy"},
            3:{desc:"Nuageux",icon:"cloudy",bg:"bg-cloudy"},
            45:{desc:"Brouillard",icon:"fog",bg:"bg-fog"},48:{desc:"Brouillard",icon:"fog",bg:"bg-fog"},
            51:{desc:"Bruine",icon:"drizzle",bg:"bg-cloudy"},53:{desc:"Bruine",icon:"drizzle",bg:"bg-cloudy"},55:{desc:"Bruine",icon:"drizzle",bg:"bg-cloudy"},
            61:{desc:"Pluie faible",icon:"rain",bg:"bg-rain"},63:{desc:"Pluie",icon:"rain",bg:"bg-rain"},65:{desc:"Pluie forte",icon:"heavyRain",bg:"bg-rain"},
            71:{desc:"Neige",icon:"snow",bg:"bg-snow"},73:{desc:"Neige",icon:"snow",bg:"bg-snow"},75:{desc:"Neige forte",icon:"snow",bg:"bg-snow"},
            80:{desc:"Averses",icon:"rain",bg:"bg-rain"},81:{desc:"Averses",icon:"rain",bg:"bg-rain"},82:{desc:"Averses fortes",icon:"heavyRain",bg:"bg-rain"},
            95:{desc:"Orage",icon:"thunder",bg:"bg-storm"},96:{desc:"Orage",icon:"thunder",bg:"bg-storm"},99:{desc:"Orage violent",icon:"thunder",bg:"bg-storm"}
        };
        return m[code] || {desc:"--",icon:"cloudy",bg:"bg-cloudy"};
    }

    function showLoading(){document.getElementById("loadingOverlay").classList.remove("hidden")}
    function hideLoading(){document.getElementById("loadingOverlay").classList.add("hidden")}
    function showToast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},3000)}
    function $(id){return document.getElementById(id)}

    // ---- Search ----
    var searchTimer;
    $("searchInput").addEventListener("input",function(e){clearTimeout(searchTimer);var q=e.target.value.trim();if(q.length<2){$("searchResults").classList.remove("active");return}searchTimer=setTimeout(function(){searchCities(q)},400)});
    $("searchInput").addEventListener("keydown",function(e){if(e.key==="Enter"){var q=$("searchInput").value.trim();if(q.length>=2)searchCities(q)}});
    $("searchBtn").addEventListener("click",function(){var q=$("searchInput").value.trim();if(q.length>=2)searchCities(q)});
    document.addEventListener("click",function(e){if(!e.target.closest(".search-section"))$("searchResults").classList.remove("active")});

    async function searchCities(q){
        try{
            var r=await fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(q)+"&count=8&language=fr&format=json");
            var d=await r.json();$("searchResults").innerHTML="";
            if(!d.results||!d.results.length){$("searchResults").innerHTML='<div style="padding:16px;text-align:center;opacity:0.6;">Aucun résultat</div>';$("searchResults").classList.add("active");return}
            d.results.forEach(function(c){
                var i=document.createElement("div");i.className="search-result-item";
                i.innerHTML=c.name+(c.admin1?", "+c.admin1:"")+(c.country?", "+c.country:"");
                i.addEventListener("click",function(){loadWeather(c.latitude,c.longitude,c.name);$("searchInput").value="";$("searchResults").classList.remove("active")});
                $("searchResults").appendChild(i)
            });$("searchResults").classList.add("active")
        }catch(e){showToast("Erreur recherche")}
    }

    $("locateBtn").addEventListener("click",function(){
        if(!navigator.geolocation){showToast("Non supporté");return}showLoading();
        navigator.geolocation.getCurrentPosition(
            async function(pos){
                try{var r=await fetch("https://api.bigdatacloud.net/data/reverse-geocode-client?latitude="+pos.coords.latitude+"&longitude="+pos.coords.longitude+"&localityLanguage=fr");var d=await r.json();loadWeather(pos.coords.latitude,pos.coords.longitude,d.city||d.locality||"Ma position")}
                catch(e){loadWeather(pos.coords.latitude,pos.coords.longitude,"Ma position")}
            },
            function(){hideLoading();showToast("Position indisponible")},
            {timeout:10000}
        )
    });

    // ---- API ----
    async function loadWeather(lat,lon,city){
        showLoading();
        try{
            var wr=await fetch("https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon+"&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,rain,showers,snowfall,weather_code,cloud_cover,pressure_msl,surface_pressure,wind_speed_10m,wind_direction_10m,wind_gusts_10m&hourly=temperature_2m,precipitation_probability,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_sum,precipitation_probability_max,wind_speed_10m_max&timezone=auto&forecast_days=14");
            var w=await wr.json();
            var aq=null;
            try{var ar=await fetch("https://air-quality-api.open-meteo.com/v1/air-quality?latitude="+lat+"&longitude="+lon+"&current=us_aqi");aq=await ar.json()}catch(e){}
            renderWeather(w,aq,city);
            hideLoading()
        }catch(e){hideLoading();showToast("Erreur de chargement");console.error(e)}
    }

    // ---- Rendu ----
    function renderWeather(data,aqi,city){
        var c=data.current,dd=data.daily,hh=data.hourly,isDay=c.is_day===1,wi=getWeatherInfo(c.weather_code,isDay);
        $("bgLayer").className="bg-layer "+wi.bg;
        if((c.weather_code>=51&&c.weather_code<=67)||(c.weather_code>=80&&c.weather_code<=82)){var rc=document.getElementById("rainContainer");rc.innerHTML="";rc.classList.add("active");for(var ri=0;ri<60;ri++){var rd=document.createElement("div");rd.className="raindrop";rd.style.left=Math.random()*100+"%";rd.style.animationDuration=(0.5+Math.random()*0.5)+"s";rd.style.animationDelay=Math.random()*2+"s";rd.style.opacity=0.2+Math.random()*0.3;rc.appendChild(rd)}}else{var rc2=document.getElementById("rainContainer");rc2.classList.remove("active");rc2.innerHTML=""}
        $("cityName").textContent=city;$("weatherDesc").textContent=wi.desc;$("weatherIconHero").innerHTML=weatherIcons[wi.icon]||weatherIcons.cloudy;
        $("tempMain").textContent=Math.round(c.temperature_2m);$("tempMax").textContent=Math.round(dd.temperature_2m_max[0]);$("tempMin").textContent=Math.round(dd.temperature_2m_min[0]);$("feelsLike").textContent=Math.round(c.apparent_temperature);

        // ---- Horaire - FUSEAU LOCAL de la ville ----
        // Open-Meteo avec timezone=auto retourne les heures en temps local
        // On extrait l'heure depuis la chaîne ISO, PAS via new Date() qui utiliserait le fuseau navigateur
        var nowLocalH = extractHour(hh.time[0]); // heure locale actuelle = première entrée
        var hs=$("hourlyScroll");hs.innerHTML="";
        for(var i=0;i<24;i++){
            if(!hh.time[i])break;
            var hVal=extractHour(hh.time[i]),hi=getWeatherInfo(hh.weather_code[i],hh.is_day[i]),it=document.createElement("div");it.className="hour-item";
            var isNow = (hVal === nowLocalH);
            var label = isNow ? "Maintenant" : extractTime(hh.time[i]);
            it.innerHTML='<div class="hour-time" style="'+(isNow?"font-weight:700;opacity:1":"")+'">'+label+'</div><div class="hour-icon">'+(weatherIcons[hi.icon]||weatherIcons.cloudy)+'</div><div class="hour-temp">'+Math.round(hh.temperature_2m[i])+'°</div>'+(hh.precipitation_probability[i]>10?'<div class="hour-precip">'+hh.precipitation_probability[i]+'%</div>':"");hs.appendChild(it)
        }

        // ---- Quotidien - FUSEAU LOCAL ----
        var dc=$("dailyForecast");dc.innerHTML="";
        var gMin=Math.min.apply(null,dd.temperature_2m_min),gMax=Math.max.apply(null,dd.temperature_2m_max),rg=gMax-gMin||1;
        for(var i=0;i<10;i++){
            if(!dd.time[i])break;
            var di=getWeatherInfo(dd.weather_code[i],true),min=dd.temperature_2m_min[i],max=dd.temperature_2m_max[i],pp=dd.precipitation_probability_max[i],bl=((min-gMin)/rg)*100,bw=((max-min)/rg)*100,r=document.createElement("div");r.className="day-row";
            r.innerHTML='<div class="day-name">'+dayLabel(dd.time[i],i)+'</div><div class="day-icon">'+(weatherIcons[di.icon]||weatherIcons.cloudy)+'</div>'+(pp>5?'<div class="day-precip">'+pp+'%</div>':'<div class="day-precip"></div>')+'<div class="day-min">'+Math.round(min)+'°</div><div class="day-bar-container"><div class="day-bar" style="left:'+bl+"%;width:"+bw+'%"></div></div><div class="day-max">'+Math.round(max)+'°</div>';dc.appendChild(r)
        }

        // ---- Données détaillées ----
        $("uvValue").textContent=Math.round(dd.uv_index_max[0]);$("uvSub").textContent=uvText(dd.uv_index_max[0]);$("uvIndicator").style.left=Math.min((dd.uv_index_max[0]/11)*100,100)+"%";
        $("humidityValue").textContent=c.relative_humidity_2m;var dp=c.temperature_2m-((100-c.relative_humidity_2m)/5);$("humiditySub").textContent="Rosée: "+Math.round(dp)+"°";
        $("windValue").textContent=Math.round(c.wind_speed_10m);$("windSub").textContent=windDir(c.wind_direction_10m);
        $("pressureValue").textContent=Math.round(c.pressure_msl);$("pressureSub").textContent=(c.pressure_msl>1013?"Haute":c.pressure_msl<1013?"Basse":"Normale")+" | "+Math.round(c.surface_pressure)+"hPa sol";
        var vis=10;if(c.weather_code>=45&&c.weather_code<=48)vis=3;else if(c.weather_code>=51&&c.weather_code<=67)vis=6;else if(c.precipitation>2)vis=5;$("visibilityValue").textContent=vis;$("visibilitySub").textContent=vis>=10?"Excellente":vis>=6?"Bonne":vis>=3?"Réduite":"Faible";
        $("sunriseTime").textContent=extractTime(dd.sunrise[0]);$("sunsetTime").textContent=extractTime(dd.sunset[0]);
        // Calcul position soleil depuis les chaînes ISO (fuseau local)
        var srH=extractHour(dd.sunrise[0]),ssH=extractHour(dd.sunset[0]),sp=50;
        if(nowLocalH>srH&&nowLocalH<ssH)sp=((nowLocalH-srH)/(ssH-srH))*100;else if(nowLocalH>=ssH)sp=100;else sp=0;
        $("sunDot").style.left=sp+"%";$("sunDot").style.bottom=Math.max(-5,Math.sin((sp/100)*Math.PI)*40-5)+"px";
        var fl=Math.round(c.apparent_temperature);$("feelsLikeValue").textContent=fl;var df=fl-Math.round(c.temperature_2m);$("feelsLikeSub").textContent=df>0?"+"+df+"°":df<0?df+"°":"Égal";
        var pr=c.precipitation||0,rn=c.rain||0,sh=c.showers||0,sn=c.snowfall||0,tp=Math.max(pr,rn+sh+sn);$("precipValue").textContent=tp.toFixed(1);$("precipSub").textContent=precipDesc(tp)+(sn>0?" dont "+sn+"mm neige":"");
        var gs=c.wind_gusts_10m||0;$("gustValue").textContent=Math.round(gs);$("gustSub").textContent=gs>80?"Violent":gs>60?"Fort":gs>40?"Modéré":gs>20?"Sensible":"Faible";
        $("cloudValue").textContent=c.cloud_cover||0;$("cloudSub").textContent=cloudDesc(c.cloud_cover||0);
        if(aqi&&aqi.current&&aqi.current.us_aqi!==undefined){var aqv=aqi.current.us_aqi;$("aqiValue").textContent=aqv;$("aqiLabel").textContent=aqiLabel(aqv);$("aqiIndicator").style.left=Math.min((aqv/150)*100,100)+"%"}
        $("aqiSub").textContent="--"
    }

    // ---- Start ----
    loadWeather(48.8566,2.3522,"Paris");
    </script>
